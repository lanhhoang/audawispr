[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audawispr"
version = "0.1.1"
description = "Turn language-learning audio into Anki-ready study materials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "epitran>=1.34",
    "faster-whisper>=1.2",
    "genanki>=0.13.1",
    "onnxruntime>=1.22.1,<2.0",
    "pydantic>=2",
    "static-ffmpeg>=2.7",
    "typer>=0.12",
]
authors = [{ name = "Lanh Hoang" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Education",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
]
keywords = ["anki", "language-learning", "transcription", "whisper", "flashcards", "audio", "anki-deck", "apkg", "spaced-repetition"]

[project.urls]
Homepage = "https://github.com/lanhhoang/audawispr"
Repository = "https://github.com/lanhhoang/audawispr"

[project.scripts]
audawispr = "audawispr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audawispr"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a20",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
